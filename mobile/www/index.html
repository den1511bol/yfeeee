<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>YFE Craft</title>
<style>html,body{margin:0;height:100%;background:#0b1220;color:#cfe;font:600 16px system-ui;display:flex;align-items:center;justify-content:center;text-align:center}small{opacity:.6;font-weight:500}</style></head>
<body><div>YFE Craft<br><small id="s">Проверка обновлений… · @yfeeeee</small></div>
<script>
// Автообновление: при каждом запуске берём свежую игру из GitHub; нет сети — последняя сохранённая или встроенная.
// Разработчик: @yfeeeee
(function () {
  var URL = "https://raw.githubusercontent.com/den1511bol/yfeeee/main/game/index.html", KEY = "yfe_game_html", done = false;
  function run(html) { if (done) return; done = true; document.open(); document.write(html); document.close(); }
  function ok(t) { return typeof t === "string" && t.length > 100000 && t.indexOf("</html>") > 0 && t.indexOf("YFE") >= 0; }
  function fallback() {
    var c = null; try { c = localStorage.getItem(KEY); } catch (e) {}
    if (ok(c)) return run(c);
    fetch("game.html").then(function (r) { return r.text(); }).then(run).catch(function () { document.getElementById("s").textContent = "Ошибка загрузки"; });
  }
  var timer = setTimeout(fallback, 6000);
  fetch(URL + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(function (t) {
    if (!ok(t)) throw 0; clearTimeout(timer); try { localStorage.setItem(KEY, t); } catch (e) {} run(t);
  }).catch(function () { clearTimeout(timer); fallback(); });
})();
</script></body></html>
